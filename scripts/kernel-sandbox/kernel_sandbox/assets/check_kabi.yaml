# ==============================================================================
# Execution target: CONTAINER
# Description: validates kernel kABI compatibility (ksymvers & ksymtypes).
# Context: runs inside ContainerEngine with linux_dir mounted at /workspace/
#          and host worktree's kabi/ directory mounted at /kabi.
# ENV: inherits KABI_ARCH, KABI_FLAVOR, and JOBS from env_dict.
# ==============================================================================
command:
  - /bin/bash
  - -c
  - |
    set -e
    rules_arg=()
    if [ -f "/kabi/severities" ]; then
        rules_arg=(--rules=/kabi/severities)
    fi
    printf '%-28s' "Checking kabi..."
    if ! ksymvers compare "${rules_arg[@]}" \
            --format=symbols:/workspace/changed-exports \
            "/kabi/${KABI_ARCH}/symvers-${KABI_FLAVOR}" \
            "/workspace/Module.symvers" \
            &>"/workspace/kabi-log"; then
        echo "FAIL"
        cat "/workspace/kabi-log"
        if [ -f "/workspace/changed-exports" ]; then
            echo "Detailed kabi comparison:"
            ksymtypes compare -j"${JOBS:-$(nproc)}" \
                --filter-symbol-list="/workspace/changed-exports" \
                "/kabi/${KABI_ARCH}/symtypes-${KABI_FLAVOR}" \
                "/workspace" || true
        fi
        exit 1
    else
        echo "PASS"
    fi
