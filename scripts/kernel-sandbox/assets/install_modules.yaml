# ==============================================================================
# Execution target: CONTAINER
# Description: installs compiled kernel modules into the staged module root.
# Context: runs inside ContainerEngine with linux_dir mounted at /workspace/
#          and target staging directory mounted at /module_root.
# ENV: inherits ARCH, CROSS_COMPILE, CC, HOSTCC from env_dict.
# ==============================================================================
command:
  - make
  - modules_install
  - INSTALL_MOD_PATH=/module_root
