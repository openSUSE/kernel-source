# ==============================================================================
# Execution target: CONTAINER
# Description: compiles the Linux kernel using sequence-patch generated .config.
# Context: runs inside ContainerEngine with linux_dir mounted at /workspace/.
# ENV: inherits ARCH, CROSS_COMPILE, CC, HOSTCC, GIT_MARKER,
#              ENABLE_CONFIGS, DISABLE_CONFIGS, and JOBS from env_dict.
# ==============================================================================
command:
  - /bin/bash
  - -c
  - |
    set -e
    printf '%s\n' "$GIT_MARKER" > localversion
    make clean
    read -r -a enable_list <<< "$ENABLE_CONFIGS"
    for cfg in "${enable_list[@]}"; do
        [ -n "$cfg" ] && ./scripts/config --enable "$cfg"
    done
    read -r -a disable_list <<< "$DISABLE_CONFIGS"
    for cfg in "${disable_list[@]}"; do
        [ -n "$cfg" ] && ./scripts/config --disable "$cfg"
    done
    yes "" | make oldconfig
    make -j"${JOBS:-$(nproc)}"
