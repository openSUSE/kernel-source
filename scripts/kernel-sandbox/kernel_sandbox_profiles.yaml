# kernel_sandbox_profiles.yaml
qemu_arch_profiles:
  # per-arch QEMU machine/cpu/console profiles
  # to build the qemu-system-<arch> invocation.
  # ref: https://github.com/rapido-linux/rapido/blob/master/src/bin/rapido-vm.rs
  # {"qemu_bin": <qemu-system-<arch> binary name>, [MANDATORY]
  #  "machine": <qemu -machine type>, [MANDATORY]
  #  "machine_args": <appended verbatim after the machine type, ex ",gic-version=max">, [OPTIONAL]
  #  "cpu_kvm": <-cpu value when enable_kvm=True>, [MANDATORY]
  #  "cpu_tcg": <-cpu value under emulation>, [MANDATORY]
  #  "console": <kernel console= name for -append, ex "ttyS0">}, [MANDATORY]
  x86_64:
    qemu_bin: "qemu-system-x86_64"
    machine: "q35"
    machine_args: ""
    cpu_kvm: "host"
    cpu_tcg: "max"
    console: "ttyS0"
  arm64: &arm_profile
    qemu_bin: "qemu-system-aarch64"
    machine: "virt"
    machine_args: ",gic-version=max"
    cpu_kvm: "host"
    cpu_tcg: "max"
    console: "ttyAMA0"
  aarch64: *arm_profile
  ppc64le:
    qemu_bin: "qemu-system-ppc64"
    machine: "pseries"
    cpu_kvm: "host"
    cpu_tcg: "max"
    console: "hvc0"
  s390x:
    qemu_bin: "qemu-system-s390x"
    machine: "s390-ccw-virtio"
    cpu_kvm: "host"
    cpu_tcg: "max"
    console: "ttysclp0"

osc_api_urls:
  # osc -A <url> endpoint used for the rpm-mode host build. If either key is
  # omitted, kernel-sandbox falls back to its built-in default
  ibs: "https://api.suse.de"
  obs: "https://api.opensuse.org"

container_registries:
  # pattern matching on OBS/IBS targets parsed from rpm/config.sh
  # format: "(IBS|OBS)_TARGET"(rpm/config.sh): "<registry_image_location:tag>"
  # FIXME: currently some dependencies needed and generated at below registry images but finally move the images to Kernel:tools:Images project
  "SUSE:SLFO:Main": "registry.opensuse.org/home/sthackarajan/branches/kernel/tools/images/16.1/kernel-build-initrd:latest" # 16.1-ga
  "SUSE:SLFO:1.2": "registry.opensuse.org/home/sthackarajan/branches/kernel/tools/images/16.0/kernel-build-initrd:latest" # 16.0
  "SUSE:SLFO:1.3": "registry.opensuse.org/home/sthackarajan/branches/kernel/tools/images/16.1/kernel-build-initrd:latest" # 16.1
  "SUSE:SLE-15-SP7": "registry.opensuse.org/home/sthackarajan/branches/kernel/tools/images/sle_15_sp7/kernel-build-initrd:latest"
  "SUSE:SLFO:Kernel:1.0": "registry.opensuse.org/home/sthackarajan/branches/kernel/tools/images/sle_15_sp7/kernel-build-initrd:latest" # SUSE Linux Enterprise Micro 6.0
  "SUSE:SLE-15-SP6": "registry.opensuse.org/home/sthackarajan/branches/kernel/tools/images/sle_15_sp6/kernel-build-initrd:latest"
  "SUSE:SLE-15-SP6:Update": "registry.opensuse.org/home/sthackarajan/branches/kernel/tools/images/sle_15_sp6/kernel-build-initrd:latest"
  "SUSE:SLE-15-SP5": "registry.opensuse.org/home/sthackarajan/branches/kernel/tools/images/sle_15_sp5/kernel-build-initrd:latest"
  "SUSE:SLE-15-SP4": "registry.opensuse.org/home/sthackarajan/branches/kernel/tools/images/sle_15_sp4/kernel-build-initrd:latest"
  "SUSE:SLE-12-SP5:Update": "registry.opensuse.org/home/sthackarajan/branches/kernel/tools/images/sle_12_sp5/kernel-build-initrd:latest"
