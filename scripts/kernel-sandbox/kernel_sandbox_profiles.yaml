kernel_config:
  enable:
    - CONFIG_VIRTIO_PCI
    - CONFIG_VIRTIO_NET
    - CONFIG_9P_FS
    - CONFIG_NET_9P
    - CONFIG_NET_9P_VIRTIO
    - CONFIG_E1000
    - CONFIG_IP_PNP
    - CONFIG_IP_PNP_DHCP
    - CONFIG_HW_RANDOM
    - CONFIG_HW_RANDOM_VIRTIO
  disable:
    # - CONFIG_FOO

architecture_profiles:
  # Format definition:
  #   container_platform: container architecture platform string
  #   linux_arch:         Exact architecture name expected during make (passed as make ARCH=)
  #   boot_arch:          Directory name under arch/ where the compiled image is saved (arch/<boot_arch>/boot/)
  #   rpm_arch:           Target architecture name expected by RPM and osc (osc build --target=)
  #   cross_compile:      Cross-compiler prefix matching the SUSE toolchain convention
  #   kernel_image_name:  Expected output kernel image filename
  x86_64:
    container_platform: "linux/amd64"
    linux_arch: "x86_64"
    boot_arch: "x86"
    rpm_arch: "x86_64"
    cross_compile: "x86_64-suse-linux-"
    kernel_image_name: "vmlinuz"
    build_image_name: "bzImage"

  i386:
    container_platform: "linux/386"
    linux_arch: "i386"
    boot_arch: "x86"
    rpm_arch: "i386"
    cross_compile: "i386-suse-linux-"
    kernel_image_name: "vmlinuz"
    build_image_name: "bzImage"

  i586: # alias for legacy 32-bit x86 variants
    container_platform: "linux/386"
    linux_arch: "i386"
    boot_arch: "x86"
    rpm_arch: "i586"
    cross_compile: "i386-suse-linux-"
    kernel_image_name: "vmlinuz"
    build_image_name: "bzImage"

  arm64: &arm64_profile
    container_platform: "linux/arm64"
    linux_arch: "arm64"
    boot_arch: "arm64"
    rpm_arch: "aarch64"
    cross_compile: "aarch64-suse-linux-"
    kernel_image_name: "Image"
    build_image_name: "Image"

  aarch64: *arm64_profile  # canonical alias for arm64

  armv7hl:
    container_platform: "linux/arm/v7"
    linux_arch: "arm"
    boot_arch: "arm"
    rpm_arch: "armv7hl"
    cross_compile: "arm-suse-linux-"
    kernel_image_name: "zImage"
    build_image_name: "zImage"

  armv6hl:
    container_platform: "linux/arm/v6"
    linux_arch: "arm"
    boot_arch: "arm"
    rpm_arch: "armv6hl"
    cross_compile: "arm-suse-linux-"
    kernel_image_name: "zImage"
    build_image_name: "zImage"

  ppc64le:
    container_platform: "linux/ppc64le"
    linux_arch: "powerpc"
    boot_arch: "powerpc"
    rpm_arch: "ppc64le"
    cross_compile: "powerpc64le-suse-linux-"
    kernel_image_name: "vmlinux"
    build_image_name: "zImage"

  ppc64:
    container_platform: "linux/ppc64"
    linux_arch: "powerpc"
    boot_arch: "powerpc"
    rpm_arch: "ppc64"
    cross_compile: "powerpc64le-suse-linux-"
    kernel_image_name: "vmlinux"
    build_image_name: "zImage"

  s390x:
    container_platform: "linux/s390x"
    linux_arch: "s390"
    boot_arch: "s390"
    rpm_arch: "s390x"
    cross_compile: "s390x-suse-linux-"
    kernel_image_name: "image"
    build_image_name: "vmlinux"

  s390:
    container_platform: "linux/s390"
    linux_arch: "s390"
    boot_arch: "s390"
    rpm_arch: "s390"
    cross_compile: "s390-suse-linux-"
    kernel_image_name: "image"
    build_image_name: "vmlinux"

  riscv64:
    container_platform: "linux/riscv64"
    linux_arch: "riscv"
    boot_arch: "riscv"
    rpm_arch: "riscv64"
    cross_compile: "riscv64-suse-linux-"
    kernel_image_name: "Image"
    build_image_name: "Image"

  ia64:
    container_platform: "linux/ia64"
    linux_arch: "ia64"
    boot_arch: "ia64"
    rpm_arch: "ia64"
    cross_compile: "ia64-suse-linux-"
    kernel_image_name: "vmlinux.gz"
    build_image_name: "vmlinux.gz"

env:
  IBS:
    ibs_products: "/mounts/dist/ibs/SUSE/Products/"

# mapping to convert BUGZILLA_PRODUCT to the target path structure inside OBS
jeos_download_map:
# format: "BUGZILLA_PRODUCT"(rpm/config.sh): "PROD_BRANCH"
# default qcow2 image base_url: http://download.opensuse.org/repositories/SUSE:/Templates:/Images:/{PROD_BRANCH}/images/
# if you have a custom qcow2 image downloaded, use the scripts --qcow2 arg option to provide localpath to the qcow2
  "SUSE Linux Enterprise Server 16.0": "SLES-16.0"
  "SUSE Linux Enterprise Server 15 SP7": "SLE-15-SP7"
  "SUSE Linux Enterprise Server 15 SP5": "SLE-15-SP5"
  "SUSE Linux Enterprise Server 15 SP4": "SLE-15-SP4"
  "SUSE Linux Enterprise Server 12 SP5": "SLE-12-SP5"
  "SUSE Linux Enterprise Server 11 SP4 (SLES 11 SP4)": "SLE-11-SP4"
  "SUSE Linux Enterprise Micro 6.0": "SL-Micro-6.0"
  "openSUSE Tumbleweed": "openSUSE:Factory"
  # direct_url: qcow2 download URL (anonymous download url)
  # "SUSE Linux Enterprise Server 16.1 Example":
  #   direct_url: "https://updates.suse.de/SUSE/Products/SLE-Product-Minimal/16.1/x86_64/SLES-16.1-Minimal-VM.x86_64-kvm-and-xen-encrypt-011-RC1.qcow2"

  # base_url: internal development paths
  # in the code arch will be appended: https://updates.suse.de/SUSE/Products/SLE-Product-Minimal/16.1/{aarch64,x86_64}
  "SUSE Linux Enterprise Server 16.1":
    base_url: "https://updates.suse.de/SUSE/Products/SLE-Product-Minimal/16.1/"
  "SUSE Linux Enterprise Server 15 SP6":
    base_url: "https://updates.suse.de/SUSE/Products/SLE-Product-Minimal/15-SP6-QU4/"